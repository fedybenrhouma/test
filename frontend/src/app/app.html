<!-- Global Background -->
<div class="fixed inset-0 z-0 pointer-events-none grid-bg">
  <div class="absolute inset-0 bg-black"></div>
  <div class="absolute top-1/3 left-1/4 w-[600px] h-[600px] bg-[#ef233c]/5 rounded-full blur-[140px] animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/3 w-[600px] h-[600px] bg-red-600/5 rounded-full blur-[140px] animate-pulse" style="animation-delay: 2s;"></div>
</div>

<app-banned-modal></app-banned-modal>

<!-- Sidebar Navigation -->
<nav class="sidebar">
  <!-- Logo -->
  <div class="px-5 py-6 border-b border-white/7">
    <div class="flex items-center gap-2.5 mb-3">
      <div class="w-7 h-7 bg-[#ef233c] rounded-md"></div>
      <span class="text-base font-display font-black tracking-tight">CryptoMAS</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="live-dot w-1.75 h-1.75"></span>
      <span class="text-xs text-[#555555] tracking-widest uppercase">System Live</span>
    </div>
  </div>

  <!-- Navigation Menu -->
  <div class="px-2.5 py-3 flex-1 overflow-y-auto">
    <div class="text-xs text-[#555555] tracking-widest uppercase font-bold px-2 pb-1 mb-3">Platform</div>
    <a routerLink="/markets" routerLinkActive="active" class="nav-item">
      <span class="icon">⬡</span> Markets
    </a>
    <a routerLink="/dashboard" *ngIf="isAuthenticated" routerLinkActive="active" class="nav-item">
      <span class="icon">◎</span> Dashboard
    </a>
    <a routerLink="/portfolio" *ngIf="isAuthenticated" routerLinkActive="active" class="nav-item">
      <span class="icon">↕</span> Portfolio
    </a>
    <a href="#" class="nav-item">
      <span class="icon">∿</span> Performance
    </a>

    <div class="text-xs text-[#555555] tracking-widest uppercase font-bold px-2 pb-1 mb-3 mt-4">System</div>
    <a href="#" class="nav-item">
      <span class="icon">⚙</span> Settings
    </a>
  </div>
</nav>

<!-- Main Layout -->
<div class="main relative flex flex-col min-h-screen">
  <app-header></app-header>
  
  <main class="flex-1 grid-bg relative">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
