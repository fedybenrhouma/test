<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-full">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white mb-2">Reset Password</h2>
      <p class="text-gray-400">Set a new password for your account</p>
    </div>

    <div *ngIf="status === 'success'" class="text-center animate-[fadeIn_0.3s_ease]">
      <div class="w-16 h-16 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-green-500">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <p class="text-white font-bold mb-2">Password Reset Successful!</p>
      <p class="text-gray-400 mb-6">{{ message }}</p>
      <p class="text-xs text-gray-500 italic">Redirecting to home page...</p>
    </div>

    <div *ngIf="status === 'error'" class="animate-[fadeIn_0.3s_ease]">
      <div class="p-4 bg-red-500/10 border border-red-500/20 rounded-lg text-red-500 flex items-center gap-3 mb-6">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-sm font-medium">{{ message }}</span>
      </div>
      <button routerLink="/markets" class="w-full py-3 bg-white/5 hover:bg-white/10 text-white font-bold rounded-lg transition-all border border-white/10">
        Back to Home
      </button>
    </div>

    <form *ngIf="status === 'form'" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="space-y-2">
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest">New Password</label>
        <input 
          type="password" 
          formControlName="password"
          placeholder="••••••••"
          class="w-full bg-gray-900 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-red-500 transition-all"
        >
        <div *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.errors" class="text-[10px] text-red-500 font-bold">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest">Confirm New Password</label>
        <input 
          type="password" 
          formControlName="confirmPassword"
          placeholder="••••••••"
          class="w-full bg-gray-900 border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-red-500 transition-all"
        >
        <div *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('mismatch')" class="text-[10px] text-red-500 font-bold">
          Passwords do not match.
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="resetForm.invalid || isLoading"
        class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all shadow-lg shadow-red-600/20 disabled:opacity-50 flex items-center justify-center gap-2"
      >
        <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        {{ isLoading ? 'Resetting Password...' : 'Reset Password' }}
      </button>
    </form>

  </div>
</div>
