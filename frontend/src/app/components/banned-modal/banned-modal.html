<div *ngIf="show" class="!fixed !inset-0 !z-[99999] flex items-center justify-center p-4">
  <!-- Dark backdrop -->
  <div class="absolute inset-0 bg-black/90 backdrop-blur-md"></div>
  
  <!-- Modal Content -->
  <div class="relative w-full max-w-md bg-[#111111] border border-[#ef233c]/30 rounded-2xl p-8 shadow-[0_0_50px_rgba(239,35,60,0.2)] animate-[fadeIn_0.3s_ease]">
    <div class="flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-[#ef233c]/10 flex items-center justify-center mb-6 border border-[#ef233c]/20">
        <iconify-icon icon="lucide:shield-off" class="text-[30px] text-[#ef233c]"></iconify-icon>
      </div>
      
      <h2 class="text-2xl font-black text-white mb-2 uppercase tracking-tight">Access Restricted</h2>
      <p class="text-[#888888] text-sm mb-8">Your account has been suspended for violating our terms of service.</p>
      
      <div class="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl p-5 mb-8 text-left">
        <div class="mb-4">
          <p class="text-[10px] font-bold text-[#555555] uppercase tracking-widest mb-1">Reason</p>
          <p class="text-sm text-white font-medium">{{ banData?.reason || 'Violation of terms' }}</p>
        </div>
        
        <div *ngIf="banData?.expires">
          <p class="text-[10px] font-bold text-[#555555] uppercase tracking-widest mb-1">Status</p>
          <p class="text-sm text-[#ef233c] font-bold">Suspended until {{ banData?.expires | date:'medium' }}</p>
        </div>
        
        <div *ngIf="!banData?.expires">
          <p class="text-[10px] font-bold text-[#555555] uppercase tracking-widest mb-1">Status</p>
          <p class="text-sm text-[#ef233c] font-bold uppercase tracking-widest">Permanent Suspension</p>
        </div>
      </div>
      
      <div class="w-full">
        <button 
          (click)="logout()"
          class="w-full p-4 bg-[#ef233c] text-white font-bold text-[0.75rem] uppercase tracking-[0.2em] rounded-xl cursor-pointer transition-all duration-200 mb-4 hover:brightness-110 active:scale-[0.98]"
        >
          Logout and Disconnect
        </button>
        
        <p class="text-[10px] text-[#555555] font-mono">
          Auto-logout in {{ countdown }} seconds...
        </p>
      </div>
    </div>
  </div>
</div>
