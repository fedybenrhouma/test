<div class="flex min-h-screen items-center justify-center bg-linear-to-br from-[#667eea] to-[#764ba2]">
  <div class="w-full max-w-[400px] rounded-lg bg-white p-10 shadow-[0_4px_6px_rgba(0,0,0,0.1)]">
    <h1 class="mb-[30px] text-center text-[24px] font-semibold text-[#333]">Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-5 flex flex-col">
        <label for="email" class="mb-2 text-[14px] font-medium text-[#333]">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded-sm border border-[#ddd] p-[10px_12px] text-[14px] outline-none transition-all focus:border-[#667eea]"
          placeholder="Enter your email"
        />
        <div class="mt-[5px] text-[12px] text-color-error" *ngIf="submitted && f['email'].errors">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">
            Please enter a valid email
          </span>
        </div>
      </div>

      <div class="mb-5 flex flex-col">
        <label for="password" class="mb-2 text-[14px] font-medium text-[#333]">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded-sm border border-[#ddd] p-[10px_12px] text-[14px] outline-none transition-all focus:border-[#667eea]"
          placeholder="Enter your password"
        />
        <div class="mt-[5px] text-[12px] text-color-error" *ngIf="submitted && f['password'].errors">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">
            Password must be at least 6 characters
          </span>
        </div>
      </div>

      <div class="mb-5 rounded-sm border border-[#f5c6cb] bg-[#f8d7da] p-3 text-[#721c24]" *ngIf="error">
        {{ error }}
      </div>

      <button
        type="submit"
        class="flex w-full cursor-pointer items-center justify-center rounded-sm border-none bg-[#667eea] p-[10px] text-base font-semibold text-white transition-all hover:bg-[#556fd1] disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="loading"
      >
        <span *ngIf="loading" class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
        <span>Login</span>
      </button>
    </form>

    <p class="mt-5 text-center text-[14px] text-[#666]">
      Don't have an account?
      <a (click)="navigateToRegister()" class="cursor-pointer font-semibold text-[#667eea] no-underline hover:underline">Register here</a>
    </p>
  </div>
</div>
