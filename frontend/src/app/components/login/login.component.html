<div class="min-h-screen flex items-center justify-center bg-[#0a0a0a] px-3 py-6 sm:px-4 sm:py-8 animate-[fadeIn_0.3s_ease]">
  <div class="w-full max-w-sm sm:max-w-[420px]">
    <!-- Logo/Header -->
    <div class="mb-6 text-center animate-[slideUp_0.4s_ease]">
      <h1 class="text-3xl sm:text-4xl font-display font-black text-[#f2f2f2] mb-1.5 sm:mb-2 tracking-tight">CryptoMAS</h1>
      <p class="text-xs sm:text-[14px] text-[#888888]">AI-powered trading debates & portfolio analysis</p>
    </div>

    <!-- Login Card -->
    <div class="bg-[#111111] border border-white/7 rounded-2xl p-6 sm:p-8 shadow-[0_20px_60px_rgba(0,0,0,0.5)] animate-[slideUp_0.5s_ease]">
      <h2 class="text-xl font-bold text-[#f2f2f2] mb-6 text-center">Welcome Back</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email Field -->
        <div class="flex flex-col animate-[slideUp_0.6s_ease]">
          <label for="email" class="mb-2 text-xs sm:text-[13px] font-semibold text-[#f2f2f2] uppercase tracking-wider">Email Address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-[13px] sm:text-[14px] text-[#f2f2f2] placeholder-[#555555] outline-none transition-all duration-200 focus:border-[#ef233c] focus:ring-2 focus:ring-[#ef233c]/20 focus:scale-[1.02]"
            placeholder="your@email.com"
          />
          <div class="mt-1.5 text-[11px] sm:text-[12px] text-[#ef233c]" *ngIf="submitted && f['email'].errors">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Please enter a valid email address</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="flex flex-col animate-[slideUp_0.7s_ease]">
          <label for="password" class="mb-2 text-xs sm:text-[13px] font-semibold text-[#f2f2f2] uppercase tracking-wider">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg px-3 sm:px-4 py-2.5 sm:py-3 text-[13px] sm:text-[14px] text-[#f2f2f2] placeholder-[#555555] outline-none transition-all duration-200 focus:border-[#ef233c] focus:ring-2 focus:ring-[#ef233c]/20 focus:scale-[1.02]"
            placeholder="Enter your password"
          />
          <div class="mt-1.5 text-[11px] sm:text-[12px] text-[#ef233c]" *ngIf="submitted && f['password'].errors">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <!-- Error Alert -->
        <div class="rounded-lg border border-[#ef233c]/30 bg-[#ef233c]/10 p-3 text-[#ef233c] text-[12px] sm:text-[13px] animate-[slideUp_0.8s_ease]" *ngIf="error">
          <div class="flex items-start gap-2">
            <iconify-icon icon="lucide:alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></iconify-icon>
            <span>{{ error }}</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full mt-4 sm:mt-6 bg-[#ef233c] hover:bg-[#d41f2f] text-white font-bold text-xs sm:text-[14px] uppercase tracking-wider py-2.5 sm:py-3 rounded-lg transition-all duration-200 hover:shadow-[0_0_20px_rgba(239,35,60,0.4)] active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 animate-[slideUp_0.8s_ease]"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>{{ loading ? 'Signing In...' : 'Sign In' }}</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="my-5 sm:my-6 flex items-center gap-3 animate-[slideUp_0.9s_ease]">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-[10px] sm:text-[12px] text-[#555555] uppercase tracking-wider">New User?</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Register Link -->
      <button
        type="button"
        (click)="navigateToRegister()"
        class="w-full border border-white/10 hover:border-white/20 text-[#f2f2f2] hover:text-white hover:bg-white/5 font-semibold text-xs sm:text-[14px] uppercase tracking-wider py-2.5 sm:py-3 rounded-lg transition-all duration-200 bg-transparent animate-[slideUp_1s_ease]"
      >
        Create Account
      </button>
    </div>

    <!-- Footer Text -->
    <p class="mt-4 sm:mt-6 text-center text-[10px] sm:text-[12px] text-[#555555] animate-[slideUp_1.1s_ease]">
      By signing in, you agree to our
      <a href="#" class="text-[#ef233c] hover:text-[#ff3d4d] transition-colors duration-200">Terms of Service</a>
      and
      <a href="#" class="text-[#ef233c] hover:text-[#ff3d4d] transition-colors duration-200">Privacy Policy</a>
    </p>
  </div>
</div>
