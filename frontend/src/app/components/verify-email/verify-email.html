<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-full text-center">
    
    <div *ngIf="status === 'loading'" class="mb-4">
      <svg class="animate-spin h-12 w-12 text-blue-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>

    <div *ngIf="status === 'success'" class="mb-4 text-green-500">
      <svg class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <div *ngIf="status === 'error'" class="mb-4 text-red-500">
      <svg class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <h2 class="text-2xl font-bold text-white mb-2">
      <ng-container *ngIf="status === 'loading'">Verifying Email</ng-container>
      <ng-container *ngIf="status === 'success'">Verification Successful</ng-container>
      <ng-container *ngIf="status === 'error'">Verification Failed</ng-container>
    </h2>
    
    <p class="text-gray-400 mb-6">{{ message }}</p>

    <div *ngIf="status !== 'loading'">
      <a routerLink="/markets" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded transition duration-200">
        Go to Markets
      </a>
    </div>

  </div>
</div>
