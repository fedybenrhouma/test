<div class="w-full flex flex-col" style="height: calc(100vh - 50px); padding-top: 10vh;">
  
  <!-- Loading State -->
  <div *ngIf="loadingChart" class="flex flex-col items-center justify-center flex-1">
    <div class="h-[50px] w-[50px] animate-spin rounded-full border-4 border-white/10 border-t-[#ef233c]"></div>
    <p class="mt-5 text-text-3">Checking chart availability...</p>
  </div>

  <!-- Chart State -->
  <div *ngIf="!loadingChart && chartAvailable" class="w-full flex-1" style="display: flex; flex-direction: column;">
    <div #tvWidgetContainer class="w-full h-full"></div>
  </div>

  <!-- Fallback State -->
  <div *ngIf="!loadingChart && !chartAvailable" class="flex flex-col items-center justify-center flex-1">
    <div class="text-[48px] mb-4">📈</div>
    <h2 class="text-xl font-bold text-text-1 mb-2 text-center">Chart Not Available</h2>
    <p class="text-text-2 text-center mb-6">We couldn't find TradingView chart data for <strong>{{ symbol }}</strong> across supported exchanges.</p>
    <button (click)="goBack()" class="bg-[#ef233c] hover:bg-[#d41f2f] text-white font-semibold py-2 px-6 rounded-md transition-colors cursor-pointer border-none outline-none">
      Back to Markets
    </button>
  </div>

</div>
