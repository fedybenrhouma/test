<div class="fixed inset-0 bg-white" style="top: 70px; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column;">
  
  <!-- Loading State -->
  <div *ngIf="loadingChart" class="flex flex-col items-center justify-center flex-1">
    <div class="h-[50px] w-[50px] animate-spin rounded-full border-4 border-[#f3f3f3] border-t-[#667eea]"></div>
    <p class="mt-5 text-[#666]">Checking chart availability...</p>
  </div>

  <!-- Chart State -->
  <div *ngIf="!loadingChart && chartAvailable" class="flex-1 w-full overflow-hidden" style="display: flex; flex-direction: column; min-height: 0;">
    <div #tvWidgetContainer class="w-full h-full flex-1" style="display: flex; flex-direction: column;"></div>
  </div>

  <!-- Fallback State -->
  <div *ngIf="!loadingChart && !chartAvailable" class="flex flex-col items-center justify-center flex-1">
    <div class="text-[48px] mb-4">📈</div>
    <h2 class="text-xl font-bold text-[#333] mb-2 text-center">Chart Not Available</h2>
    <p class="text-[#666] text-center mb-6">We couldn't find TradingView chart data for <strong>{{ symbol }}</strong> across supported exchanges.</p>
    <button (click)="goBack()" class="bg-[#667eea] hover:bg-[#556fd1] text-white font-semibold py-2 px-6 rounded-md transition-colors cursor-pointer border-none outline-none">
      Back to Markets
    </button>
  </div>

</div>
